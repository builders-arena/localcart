<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalCart Control Panel</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e1e4ed;
      --text-muted: #8b8fa3;
      --accent: #6366f1;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --font: system-ui, -apple-system, sans-serif;
      --mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-rows: 48px 1fr 200px;
      grid-template-columns: 1fr 320px;
    }

    /* --- Header Bar --- */
    header {
      grid-column: 1 / -1;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge.idle { background: var(--border); color: var(--text-muted); }
    .status-badge.active { background: rgba(34,197,94,0.15); color: var(--success); }
    .status-badge.blocked { background: rgba(239,68,68,0.15); color: var(--danger); }
    .status-badge.waiting { background: rgba(245,158,11,0.15); color: var(--warning); }

    .kill-btn {
      margin-left: auto;
      background: rgba(239,68,68,0.1);
      color: var(--danger);
      border: 1px solid rgba(239,68,68,0.3);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    /* --- Action Log --- */
    .action-log {
      overflow-y: auto;
      padding: 12px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
    }

    .log-entry {
      padding: 4px 8px;
      border-radius: 4px;
    }

    .log-entry:hover { background: rgba(255,255,255,0.03); }
    .log-entry .timestamp { color: var(--text-muted); margin-right: 8px; }
    .log-entry .action { color: var(--accent); font-weight: 500; }
    .log-entry .result-ok { color: var(--success); }
    .log-entry .result-err { color: var(--danger); }

    /* --- Approval Panel (right sidebar) --- */
    .sidebar {
      grid-row: 2 / 4;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      padding: 12px 16px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    .approval-card {
      margin: 12px;
      padding: 16px;
      background: var(--bg);
      border: 1px solid var(--warning);
      border-radius: 8px;
    }

    .approval-card .action-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--warning);
      margin-bottom: 8px;
    }

    .approval-card .details {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
      font-family: var(--mono);
    }

    .approval-actions {
      display: flex;
      gap: 8px;
    }

    .btn-approve {
      flex: 1;
      padding: 10px;
      background: var(--success);
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .btn-reject {
      flex: 1;
      padding: 10px;
      background: rgba(239,68,68,0.15);
      color: var(--danger);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    /* --- Page State Panel (bottom) --- */
    .page-state {
      border-top: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 11px;
    }

    .page-state pre {
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-muted);
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 12px;
      height: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>LOCALCART</h1>
    <span id="status" class="status-badge idle">IDLE</span>
    <span id="rate-info" style="font-size:11px; color:var(--text-muted)"></span>
    <button class="kill-btn" onclick="emergencyStop()">EMERGENCY STOP</button>
  </header>

  <section class="action-log" id="log">
    <div class="empty-state">Waiting for actions...</div>
  </section>

  <aside class="sidebar">
    <h2>Approvals</h2>
    <div id="approvals">
      <div class="empty-state">No pending approvals</div>
    </div>
  </aside>

  <section class="page-state">
    <pre id="page-state-json">No page state yet</pre>
  </section>

  <script>
    const ws = new WebSocket(`ws://localhost:7701`);
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const approvalsEl = document.getElementById('approvals');
    const pageStateEl = document.getElementById('page-state-json');
    let firstLog = true;

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      switch (msg.type) {
        case 'bridge_state':
          updateStatus(msg.state);
          break;

        case 'action_executed':
          appendLog(msg.action, msg.result);
          if (msg.result.pageState) {
            pageStateEl.textContent = JSON.stringify(msg.result.pageState, null, 2);
          }
          break;

        case 'page_navigated':
          pageStateEl.textContent = JSON.stringify(msg.pageState, null, 2);
          break;

        case 'approval_required':
          showApproval(msg.request);
          updateStatus('waiting');
          break;

        case 'notification':
          appendLog(msg.data.action, { status: 'notify' });
          break;

        case 'interstitial':
          updateStatus('blocked');
          appendLog(
            { action: 'INTERSTITIAL', type: msg.data.type },
            { status: 'blocked' }
          );
          break;
      }
    };

    function updateStatus(state) {
      statusEl.textContent = state.toUpperCase();
      statusEl.className = 'status-badge';
      if (['navigating', 'executing_action', 'extracting'].includes(state)) {
        statusEl.classList.add('active');
      } else if (['captcha_detected', 'error_recovery'].includes(state)) {
        statusEl.classList.add('blocked');
      } else if (['hitl_waiting'].includes(state)) {
        statusEl.classList.add('waiting');
      } else {
        statusEl.classList.add('idle');
      }
    }

    function appendLog(action, result) {
      if (firstLog) { logEl.innerHTML = ''; firstLog = false; }
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const ts = new Date().toLocaleTimeString();
      const resultClass = result.status === 'success' || result.status === 'notify'
        ? 'result-ok' : 'result-err';
      entry.innerHTML = `<span class="timestamp">${ts}</span>`
        + `<span class="action">${action.action || action.type || 'unknown'}</span> `
        + `<span class="${resultClass}">${result.status}</span>`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function showApproval(request) {
      approvalsEl.innerHTML = '';
      const card = document.createElement('div');
      card.className = 'approval-card';
      card.innerHTML = `
        <div class="action-name">${request.action.action.replace(/_/g, ' ').toUpperCase()}</div>
        <div class="details">${JSON.stringify(request.action, null, 2)}</div>
        <div class="approval-actions">
          <button class="btn-approve" onclick="respond('${request.id}', true)">APPROVE</button>
          <button class="btn-reject" onclick="respond('${request.id}', false)">REJECT</button>
        </div>
      `;
      approvalsEl.appendChild(card);
    }

    function respond(id, approved) {
      ws.send(JSON.stringify({ type: 'approval_response', id, approved }));
      approvalsEl.innerHTML = '<div class="empty-state">No pending approvals</div>';
      updateStatus('executing_action');
    }

    function emergencyStop() {
      // Close the WebSocket, which signals the bridge to pause
      ws.close();
      updateStatus('stopped');
      alert('Emergency stop triggered. Reload the page to reconnect.');
    }
  </script>
</body>
</html>
